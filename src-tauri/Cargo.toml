[package]
name = "mini-crm-simulator"
version = "0.1.0"
description = "A Chinese-first local CRM simulator"
authors = ["tangerine"]
edition = "2021"

[lib]
name = "mini_crm_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
